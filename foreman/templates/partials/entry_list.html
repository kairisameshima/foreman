<ol class="entry-list" id="entry-list">
  {% for entry in entries %}
  <li class="entry kind-{{ entry.kind }}">
    <div class="entry-meta">
      <time datetime="{{ entry.created_at.isoformat() }}">{{ entry.created_at | timestamp }}</time>
      <span class="badge entry-{{ entry.kind }}">{{ entry.kind }}</span>
      <span class="source">{{ entry.source }}</span>
      {% if entry.work_item_id %}
      <a href="/items/{{ entry.work_item_id }}">{{ item_titles.get(entry.work_item_id, entry.work_item_id) }}</a>
      {% endif %}
    </div>
    <pre class="entry-body">{{ entry.body }}</pre>
  </li>
  {% else %}
  <li class="muted">No entries yet.</li>
  {% endfor %}
</ol>
